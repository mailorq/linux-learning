id: network.allow_https
title: разрешить входящие https соединения
level: intermediate
topic: network
role: root@ubuntu-srv-01:~#
objective: нужно добавить правило ufw для входящих tcp соединений на порт https
command_rules:
  - executable: ufw
    required_subcommands: [allow]
    required_arguments: [443/tcp]
    allow_extra_arguments: false
hints:
  - level: concept
    text: ufw управляет правилами межсетевого экрана, а протокол можно указать вместе с номером порта
    progress_penalty: 0
  - level: tools
    text: используй ufw, действие allow и порт 443 с протоколом tcp
    progress_penalty: 5
  - level: solution
    text: используй команду ufw allow 443/tcp
    progress_penalty: 15
success_explanation: ufw добавил правило, разрешающее входящие соединения по tcp на порт 443
