id: diagnostics.root_usage
title: проверить занятое место на корневом разделе
level: beginner
topic: diagnostics
role: root@ubuntu-srv-01:~#
objective: нужно вывести использование файловой системы, содержащей корневой каталог, в читаемых единицах
command_rules:
  - executable: df
    required_flags: [-h]
    flag_aliases:
      --human-readable: -h
    flag_descriptions:
      "-h": показывает размеры в читаемых единицах
    required_arguments: [/]
    allow_extra_arguments: false
hints:
  - level: concept
    text: df показывает занятое и доступное место файловых систем
    progress_penalty: 0
  - level: tools
    text: укажи корневой путь и включи читаемый формат размеров
    progress_penalty: 5
  - level: solution
    text: используй команду df --human-readable /
    progress_penalty: 15
success_explanation: df показал использование файловой системы для корневого пути в читаемых единицах
