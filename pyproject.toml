[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-learning"
version = "0.1.0"
description = "command line trainer for debian and ubuntu"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "mailorq" }]
dependencies = [
    "bashlex>=0.18",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
linux-learning = "linux_learning.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "linux_learning.scenarios" = "scenarios" }
packages = ["linux_learning", "linux_learning.scenarios"]

[tool.setuptools.package-data]
"linux_learning.scenarios" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
